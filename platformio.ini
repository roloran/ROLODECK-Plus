[platformio]
default_envs = tdeck-plus-core3

[env]
board = esp32-s3-devkitc-1
framework = arduino

; Match the hardware settings of the former Arduino CLI build:
; esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,
; PartitionScheme=app3M_fat9M_16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions/app3M_fat9M_16MB.csv

upload_speed = 921600
monitor_speed = 115200
; Opening a monitor must not reset the T-Deck or hold its peripherals in reset.
monitor_dtr = 0
monitor_rts = 0

lib_ldf_mode = deep+

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

[env:tdeck-plus-core2]
platform = platformio/espressif32@6.12.0

lib_deps =
    jgromes/RadioLib@7.7.1
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.0
    earlephilhower/ESP8266Audio@2.0.0
    mikalhart/TinyGPSPlus@1.0.3
    operatorfoundation/Crypto@0.4.0
    https://github.com/siara-cc/Unishox_Arduino_lib.git#3bc45bba85c322bd77a62e8a81d1de9825aa5f57
    https://github.com/ROLORAN/SchnorrSig.git#6cec64f3897e7f97c834c0b4df147d8c976e942b

[env:tdeck-plus-core3]
; The official PlatformIO Espressif platform still packages Arduino-ESP32
; 2.0.17. Pioarduino 55.03.39 provides Arduino-ESP32 3.3.9 on ESP-IDF 5.5.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
extra_scripts = pre:scripts/pio_core3_compat.py

lib_deps =
    jgromes/RadioLib@7.7.1
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.6
    earlephilhower/ESP8266Audio@2.4.1
    mikalhart/TinyGPSPlus@1.0.3
    operatorfoundation/Crypto@0.4.0
    https://github.com/siara-cc/Unishox_Arduino_lib.git#3bc45bba85c322bd77a62e8a81d1de9825aa5f57
    https://github.com/ROLORAN/SchnorrSig.git#6cec64f3897e7f97c834c0b4df147d8c976e942b
